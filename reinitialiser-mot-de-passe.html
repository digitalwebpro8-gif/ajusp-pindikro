<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nouveau mot de passe | AJUSP Pindikro</title>
<style>:root{--green:#17643D;--yellow:#F2C94C;--navy:#14263F;--bg:#F7F9F6}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#26352D;line-height:1.6}.header{background:var(--green);color:white;padding:18px 6%;display:flex;align-items:center;gap:12px}.header img{width:52px;height:52px;object-fit:contain;border-radius:50%}.wrap{max-width:620px;margin:55px auto;padding:0 18px}.card{background:white;padding:28px;border-radius:12px;box-shadow:0 4px 20px #14263f12}h1{color:var(--green);margin-top:0}label{display:block;font-weight:bold;margin:16px 0 6px;color:var(--navy)}input{width:100%;padding:13px;border:1px solid #ccd5ce;border-radius:6px;font:inherit}button{margin-top:20px;padding:12px 17px;background:var(--green);color:white;border:0;border-radius:6px;font-weight:bold;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.status{display:none;margin-top:16px;padding:12px;border-radius:6px;overflow-wrap:anywhere}.success{display:block;background:#e8f5ec;color:#17643D}.error{display:block;background:#fff0ee;color:#9b2820}.small{font-size:13px;color:#68756D}a{color:var(--green);font-weight:bold}</style></head>
<body><header class="header"><img src="../logo-ajusp.jpeg" alt="Logo AJUSP"><div><strong>AJUSP Pindikro</strong><br><small>Ensemble pour un avenir meilleur</small></div></header>
<main class="wrap"><section class="card"><h1>Choisir un nouveau mot de passe</h1><p class="small">Saisissez votre nouveau mot de passe, puis confirmez-le pour sécuriser votre compte AJUSP.</p>
<form id="passwordForm" hidden><label for="password">Nouveau mot de passe (8 caractères minimum)</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><label for="confirm">Confirmer le nouveau mot de passe</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required><button id="saveButton" type="submit">Enregistrer le nouveau mot de passe</button></form>
<p id="status" class="status" role="status" aria-live="polite">Vérification du lien de réinitialisation…</p><p id="backLink" class="small" hidden><a href="connexion.html">Retour à la connexion</a></p></section></main>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const supabase=createClient("https://pcgshqscsdyyszbjkvjq.supabase.co","sb_publishable_jo6bCbDh2HyT-rwoKBkSYA_cNn7XVPF");
const form=document.getElementById("passwordForm"),status=document.getElementById("status"),save=document.getElementById("saveButton"),back=document.getElementById("backLink");let recoveryReady=false;
function show(text,type){status.textContent=text;status.className="status "+type;}
function enableRecovery(){recoveryReady=true;form.hidden=false;show("Lien reconnu. Vous pouvez maintenant choisir votre nouveau mot de passe.","success");}
supabase.auth.onAuthStateChange((event,session)=>{if(event==="PASSWORD_RECOVERY"||(event==="SIGNED_IN"&&session&&new URLSearchParams(location.hash.slice(1)).get("type")==="recovery")){enableRecovery();}});
(async()=>{try{const {data,error}=await supabase.auth.getSession();if(error)throw error;const hash=new URLSearchParams(location.hash.slice(1));const hasRecovery=hash.get("type")==="recovery";if(hasRecovery&&data.session){enableRecovery();return;}if(recoveryReady)return;show("Ce lien n'est pas valide, a déjà été utilisé ou a expiré. Retournez à la connexion et demandez un nouveau lien de réinitialisation.","error");back.hidden=false;}catch(error){show(error.message||"Impossible de vérifier le lien. Demandez un nouveau lien de réinitialisation.","error");back.hidden=false;}})();
form.addEventListener("submit",async event=>{event.preventDefault();if(!recoveryReady)return;if(!form.reportValidity())return;const password=document.getElementById("password").value,confirm=document.getElementById("confirm").value;if(password!==confirm){show("Les deux mots de passe ne correspondent pas.","error");return;}save.disabled=true;save.textContent="Enregistrement…";try{const {error}=await supabase.auth.updateUser({password});if(error)throw error;show("Votre mot de passe a été modifié avec succès. Vous pouvez maintenant vous connecter avec votre nouveau mot de passe.","success");form.hidden=true;back.hidden=false;await supabase.auth.signOut();}catch(error){show(error.message||"La modification du mot de passe a échoué. Demandez un nouveau lien si nécessaire.","error");}finally{save.disabled=false;save.textContent="Enregistrer le nouveau mot de passe";}});
</script></body></html>
